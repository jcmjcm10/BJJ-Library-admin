services:
  db:
    image: postgres:17-alpine
    container_name: bjj_library_db
    env_file:
      - app.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bjj-library:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bjj_library_dev
    env_file:
      - app.env
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: ["python3.12", "/app/manage.py", "runserver", "0.0.0.0:8000"]

volumes:
  pgdata:
